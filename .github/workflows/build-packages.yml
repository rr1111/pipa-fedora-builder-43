name: Build install packages

permissions:
  contents: write

on:
  workflow_dispatch:
  
jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
    - uses: actions/checkout@v6

    - name: Build the Docker image
      run: docker build . -t 'pipa-fedora-builder'

    - name: Build the tty image
      run: docker run --privileged -v "$(pwd)"/images:/build/images -v "/dev:/dev" pipa-fedora-builder tty

    #- name: Build the Phosh image
    #  run: docker run --privileged -v "$(pwd)"/images:/build/images -v "/dev:/dev" pipa-fedora-builder phosh

    - name: Build the Plasma image
      run: docker run --privileged -v "$(pwd)"/images:/build/images -v "/dev:/dev" pipa-fedora-builder plasma

    - name: Build the Plasma Mobile image
      run: docker run --privileged -v "$(pwd)"/images:/build/images -v "/dev:/dev" pipa-fedora-builder plasma-mobile

    - name: Build the Gnome image
      run: docker run --privileged -v "$(pwd)"/images:/build/images -v "/dev:/dev" pipa-fedora-builder gnome

    #- name: Build the Niri image
    #  run: docker run --privileged -v "$(pwd)"/images:/build/images -v "/dev:/dev" pipa-fedora-builder niri 

    - name: Get current date
      id: date
      run: echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v2.6.1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        tag_name: f44-${{ steps.date.outputs.date }}
        name: Fedora 44 ${{ steps.date.outputs.date }}
        files: images/*.zip
        draft: true
