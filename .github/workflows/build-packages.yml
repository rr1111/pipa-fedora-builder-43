name: Build install packages

permissions:
  contents: write
  packages: write

on:
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/pipa-fedora-builder-43
  
jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
    - uses: actions/checkout@v6

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build the Docker image
      run: docker build . -t 'pipa-fedora-builder-43'

    - name: Tag builder image for GHCR
      run: |
        docker tag pipa-fedora-builder-43:latest "${{ env.IMAGE_NAME }}:latest"
        docker tag pipa-fedora-builder-43:latest "${{ env.IMAGE_NAME }}:${{ github.sha }}"

    - name: Push builder image to GHCR
      run: |
        docker push "${{ env.IMAGE_NAME }}:latest"
        docker push "${{ env.IMAGE_NAME }}:${{ github.sha }}"

    - name: Build the tty image
      run: docker run --privileged -v "$(pwd)"/images:/build/images -v "/dev:/dev" pipa-fedora-builder-43 tty

    - name: Build the Plasma image
      run: docker run --privileged -v "$(pwd)"/images:/build/images -v "/dev:/dev" pipa-fedora-builder-43 plasma

    - name: Build the Plasma Mobile image
      run: docker run --privileged -v "$(pwd)"/images:/build/images -v "/dev:/dev" pipa-fedora-builder-43 plasma-mobile

    - name: Build the Gnome image
      run: docker run --privileged -v "$(pwd)"/images:/build/images -v "/dev:/dev" pipa-fedora-builder-43 gnome

    - name: Get current date
      id: date
      run: echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v2.6.1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        tag_name: f44-${{ steps.date.outputs.date }}
        name: Fedora 44 ${{ steps.date.outputs.date }}
        files: images/*.zip
        draft: true
